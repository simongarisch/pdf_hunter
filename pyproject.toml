[project]
name = "pdf-hunter"
version = "1.0.0"
description = "Download PDF links from a webpage."
readme = "README.md"
authors = [
    { name = "simon.garisch" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
]

[project.scripts]
pdf-hunter = "pdf_hunter:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.15.3",
    "jupyter>=1.1.1",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]

[tool.poe.tasks]
format = "ruff format ."
lint = "ruff check --fix ."
test = "pytest --cov=. --cov-report=html --cov-report=term"
check = ["format", "lint", "test"]